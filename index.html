<!DOCTYPE html>
<html>
<head>
    <title>RGB Controller</title>
    <link rel="stylesheet" href="public/style.css">
</head>
<body>

<h1>RGB LED Controller</h1>

<div class="container">

    <button onclick="setColor('red',1)">
        🔴 RED ON
    </button>

    <button onclick="setColor('red',0)">
        🔴 RED OFF
    </button>

    <button onclick="setColor('green',1)">
        🟢 GREEN ON
    </button>

    <button onclick="setColor('green',0)">
        🟢 GREEN OFF
    </button>

    <button onclick="setColor('blue',1)">
        🔵 BLUE ON
    </button>

    <button onclick="setColor('blue',0)">
        🔵 BLUE OFF
    </button>

</div>

<script src="public/script.js"></script>

</body>
</html>
